</style></head><body><aside id="sidebar"><div class="brand"><img src="./assets/logo.png" alt="AfrodizzyActs" width="205" decoding="async"></div><div class="tag">DizzyOps • Operations</div><nav class="nav" id="nav" aria-label="Primary navigation"></nav></aside><main><header class="top"><div style="display:flex;align-items:center;gap:14px"><button class="mobile" id="menu" aria-label="Toggle navigation" aria-expanded="false">☰</button><div class="top-brand"><img src="./assets/logo.png" alt="" aria-hidden="true" width="36" height="36" style="width:36px;height:36px;object-fit:contain;vertical-align:middle;margin-right:10px"><span style="display:inline-block;vertical-align:middle"><b>DizzyOps</b><br><small>Operations workspace</small></span></div></div><div class="account-wrap"><button type="button" class="account-trigger" id="account-trigger" aria-label="Open account menu" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu"><span class="avatar" aria-hidden="true">ADA</span><span class="account-chevron" aria-hidden="true">▾</span></button><div class="account-menu" id="account-menu" role="menu" aria-label="Account options" hidden><div class="menu-note">Account access not configured</div><button type="button" role="menuitem" data-account="Profile">My profile</button><button type="button" role="menuitem" data-account="AccountSettings">Account settings</button><button type="button" role="menuitem" data-account="Login">Log in</button><button type="button" role="menuitem" data-account="Support">Help & support</button><button type="button" role="menuitem" data-account="Signout">Sign out</button></div></div></header><section class="content"><div class="eyebrow">AfrodizzyActs / Operations</div><h1 id="title">Overview</h1><p id="subtitle">Your centralized workspace for bookings, performers, finance and operations.</p><div id="view"></div></section><footer class="footer">© AfrodizzyActs · DizzyOps · Initial portal preview — no live records connected</footer></main><script>
const sections=[['Overview','Dashboard'],['Bookings','Bookings'],['Jobs & Assignments','Jobs'],['Performers','Performers'],['Clients & CRM','Clients'],['Agents & Suppliers','Partners'],['Quotes','Quotes'],['Invoices & Receipts','Invoices'],['Expenses & Commissions','Expenses'],['Payslips & Statements','Payroll'],['Costumes & Inventory','Inventory'],['Assets & Couriers','Assets'],['Fabrication','Fabrication'],['Documents','Documents'],['Post-job follow-up','FollowUp'],['Reports & Analytics','Reports'],['Settings','Settings'],['My profile','Profile'],['Account settings','AccountSettings'],['Log in','Login'],['Help & support','Support'],['Sign out','Signout']];
const nav=document.getElementById('nav'),view=document.getElementById('view'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),sidebar=document.getElementById('sidebar');
function empty(name){return '<div class="empty"><strong>No '+name.toLowerCase()+' yet</strong><p>This workspace is ready for real records once secure authentication, data storage and integrations are configured. No sample records are displayed.</p></div>'}
const accountPages={Profile:1,AccountSettings:1,Login:1,Support:1,Signout:1};
function accountView(name){const heading={Profile:'My profile',AccountSettings:'Account settings',Login:'Log in',Support:'Help & support',Signout:'Sign out'}[name];title.textContent=heading;subtitle.textContent='Account and assistance · AfrodizzyActs DizzyOps';let body='';if(name==='Profile')body='<div class="notice">No user is signed in. Profile details will be available after identity integration.</div><div class="account-grid"><section class="panel"><h2>Personal information</h2><p>Name, email, phone number and avatar will appear here for the authenticated user.</p></section><section class="panel"><h2>Organization & access</h2><p>Assigned role, permissions and organization membership will be shown here.</p></section></div>';if(name==='AccountSettings')body='<div class="notice">Display preferences are stored only in this browser. Account security and notification preferences require a connected identity service.</div><section class="panel"><h2>Display preferences</h2><label class="field">Interface density<select id="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label><button class="primary-action" id="save-preferences">Save preferences</button><p id="preferences-status" role="status"></p></section><div class="account-grid"><section class="panel"><h2>Security</h2><p>Password, multifactor authentication and active sessions will be managed through the identity provider.</p></section><section class="panel"><h2>Notifications</h2><p>Notification delivery will become available when user accounts are enabled.</p></section></div>';if(name==='Login')body='<div class="notice">Secure authentication is not yet configured. This static GitHub Pages preview cannot safely accept passwords or establish user sessions.</div><section class="panel"><h2>Secure sign-in</h2><p>Google Workspace single sign-on is planned for DizzyOps. Once the authentication backend is connected, this page will redirect to the identity provider.</p><button class="primary-action" disabled title="Authentication not configured">Sign-in coming soon</button></section>';if(name==='Support')body='<div class="account-grid"><section class="panel"><h2>Getting started</h2><p>Use the left navigation to explore bookings, performers, invoices, inventory and reporting. Records are empty until the database is connected.</p></section><section class="panel"><h2>Contact support</h2><p>Contact your AfrodizzyActs administrator for access, account or application assistance. A dedicated support channel has not yet been configured.</p></section><section class="panel"><h2>Technical details</h2><p>Application: DizzyOps · Deployment: GitHub Pages frontend · Authentication: pending · Data services: pending.</p></section></div>';if(name==='Signout')body='<div class="notice">No authenticated session exists in this preview, so there is nothing to sign out from.</div><section class="panel"><h2>Session management</h2><p>When secure sign-in is enabled, this page will end the server-side session and redirect to the login page.</p><button class="primary-action" id="return-login">Go to login</button></section>';view.innerHTML=body;if(name==='AccountSettings'){const select=document.getElementById('density');select.value=localStorage.getItem('dizzyops-density')||'comfortable';document.getElementById('save-preferences').onclick=()=>{localStorage.setItem('dizzyops-density',select.value);document.getElementById('preferences-status').textContent='Display preference saved in this browser.'}}if(name==='Signout')document.getElementById('return-login').onclick=()=>show('Login')}
function followUpView(){return `<div class="notice">Google Workspace and Drive are not connected. This screen contains no client or job data. Connect a secure backend before enabling live workflows.</div><div class="metrics"><div class="metric"><label>Jobs awaiting follow-up</label><strong>—</strong></div><div class="metric"><label>Feedback outstanding</label><strong>—</strong></div><div class="metric"><label>Media requests pending</label><strong>—</strong></div><div class="metric"><label>Media collected</label><strong>—</strong></div></div><div class="grid"><section class="panel"><h2>Post-job workflow</h2><p>Each completed job will generate an assigned follow-up record with an audit trail.</p><ol style="line-height:2;color:#ddd"><li>Thank the client using Gmail</li><li>Request and record client feedback</li><li>Request client photographs and videos</li><li>Follow up for professional photography and video</li><li>Search social channels and record source links</li><li>Request media from event or job managers</li><li>Verify usage rights and archive approved media in Drive</li></ol></section><section class="panel"><h2>Google Workspace integration</h2><p>Integration status: Not configured</p><p>Use Google OAuth 2.0 / OpenID Connect for staff sign-in, a server-side API for Gmail and Drive operations, and least-privilege permissions. Never put API secrets in GitHub Pages.</p><a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener noreferrer">Google Cloud credentials ↗</a><p><a href="https://developers.google.com/workspace/drive/api/guides/about-sdk" target="_blank" rel="noopener noreferrer">Google Drive API documentation ↗</a></p><p><a href="https://developers.google.com/workspace/gmail/api/guides" target="_blank" rel="noopener noreferrer">Gmail API documentation ↗</a></p></section></div><section class="panel" style="margin-top:18px"><h2>Follow-up register</h2><div class="empty"><strong>No follow-up records</strong><p>Once the secure backend is connected, this register will show job, client, assigned owner, thank-you status, feedback, media status, next action, deadline and linked Drive folder.</p></div></section>`}
function show(name){if(accountPages[name]){accountView(name);nav.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.page===name);b.setAttribute('aria-current',b.dataset.page===name?'page':'false')});sidebar.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');closeAccountMenu();history.replaceState(null,'','#'+name.toLowerCase());return}const valid=sections.find(s=>s[1]===name)||sections[0];name=valid[1];title.textContent=valid[0];subtitle.textContent=name==='Dashboard'?'Your centralized workspace for bookings, performers, finance and operations.':'Manage '+valid[0].toLowerCase()+' in the DizzyOps workspace.';nav.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.page===name);b.setAttribute('aria-current',b.dataset.page===name?'page':'false')});if(name==='Quotes'){window.DizzyQuotes?.render()}else if(name==='FollowUp'){view.innerHTML=followUpView()}else if(name==='Dashboard'){view.innerHTML='<div class="metrics">'+[['Active bookings','0'],['Registered performers','0'],['Open invoices','0'],['Pending assignments','0']].map(([a,b])=>'<div class="metric"><label>'+a+'</label><strong>'+b+'</strong></div>').join('')+'</div><div class="grid"><section class="panel"><h2>Upcoming bookings</h2>'+empty('bookings')+'</section><section class="panel"><h2>Recent activity</h2>'+empty('activity')+'</section></div>'}else{view.innerHTML='<div style="display:flex;justify-content:flex-end;margin:24px 0"><span class="pill">No records connected</span></div><section class="panel"><h2>'+valid[0]+'</h2>'+empty(valid[0])+'</section>'}sidebar.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');history.replaceState(null,'','#'+name.toLowerCase().replaceAll(' ','-'))}
sections.forEach(([label,key])=>{const b=document.createElement('button');b.textContent=label;b.dataset.page=key;b.addEventListener('click',()=>show(key));nav.appendChild(b)});document.getElementById('menu').addEventListener('click',()=>{const open=sidebar.classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(open))});const accountTrigger=document.getElementById('account-trigger'),accountMenu=document.getElementById('account-menu');function closeAccountMenu(){accountMenu.hidden=true;accountTrigger.setAttribute('aria-expanded','false')}function toggleAccountMenu(){accountMenu.hidden=!accountMenu.hidden;accountTrigger.setAttribute('aria-expanded',String(!accountMenu.hidden));if(!accountMenu.hidden)accountMenu.querySelector('[role="menuitem"]').focus()}accountTrigger.addEventListener('click',toggleAccountMenu);accountMenu.querySelectorAll('[data-account]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.account)));document.addEventListener('click',e=>{if(!e.target.closest('.account-wrap'))closeAccountMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAccountMenu();accountTrigger.focus()}});window.addEventListener('hashchange',()=>{const key=location.hash.slice(1).toLowerCase();const found=sections.find(s=>s[1].toLowerCase()===key);if(found)show(found[1])});show(sections.find(s=>s[1].toLowerCase()===location.hash.slice(1))?.[1]||'Dashboard');
</script><script src="./quotes.js"></script></body></html>
