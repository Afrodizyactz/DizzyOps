<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121212"><title>DizzyOps | AfrodizzyActs</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f5f5;background:#101010}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}aside{width:252px;position:fixed;inset:0 auto 0 0;background:#171717;border-right:1px solid #333;padding:26px 16px;overflow:auto}.brand{font-size:22px;font-weight:900;letter-spacing:-.8px;padding:6px 12px 28px}.brand span{color:#e83d45}.tag{font-size:10px;letter-spacing:2px;color:#aaa;margin:0 12px 20px;text-transform:uppercase}.nav{display:flex;flex-direction:column;gap:4px}.nav button{width:100%;background:transparent;border:0;color:#bbb;text-align:left;padding:12px 14px;border-radius:10px}.nav button:hover,.nav button.active{background:#a9252c;color:#fff}main{margin-left:252px;min-height:100vh}.top{padding:22px 38px;border-bottom:1px solid #292929;display:flex;align-items:center;justify-content:space-between}.top small{color:#aaa}.avatar{width:36px;height:36px;border-radius:50%;background:#333;display:grid;place-items:center;font-size:13px}.content{max-width:1300px;margin:auto;padding:42px 38px}h1{font-size:34px;margin:8px 0}h2{font-size:20px;margin:0 0 16px}p{color:#aaa;line-height:1.6}.eyebrow{color:#e65b61;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:34px 0}.metric,.panel{border:1px solid #303030;background:#1a1a1a;border-radius:16px;padding:24px}.metric label{color:#aaa;font-size:13px}.metric strong{display:block;font-size:32px;margin-top:14px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.empty{border:1px dashed #494949;border-radius:12px;padding:55px 20px;text-align:center}.empty strong{display:block;color:#eee;font-size:17px}.empty p{max-width:430px;margin:10px auto}.pill{border:1px solid #555;border-radius:30px;padding:7px 12px;font-size:12px;color:#bbb}.mobile{display:none}.footer{border-top:1px solid #292929;padding:20px 38px;color:#888;font-size:12px}a{color:#fff}button:focus-visible{outline:2px solid #ff777d;outline-offset:2px}@media(max-width:900px){aside{width:210px}main{margin-left:210px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:650px){aside{transform:translateX(-100%);transition:transform .2s;z-index:5;width:min(85vw,290px);box-shadow:0 0 40px #0009}aside.open{transform:translateX(0)}main{margin-left:0}.mobile{display:inline-flex;background:none;border:1px solid #555;color:white;border-radius:8px;padding:8px 12px}.top{padding:16px 20px}.content{padding:28px 20px}.metrics{gap:10px}.metric,.panel{padding:18px}.metric strong{font-size:27px}.footer{padding:20px}h1{font-size:29px}}</style></head><body><aside id="sidebar"><div class="brand">AFRO<span>DIZZY</span>ACTS</div><div class="tag">DizzyOps • Operations</div><nav class="nav" id="nav" aria-label="Primary navigation"></nav></aside><main><header class="top"><div style="display:flex;align-items:center;gap:14px"><button class="mobile" id="menu" aria-label="Toggle navigation" aria-expanded="false">☰</button><div><b>DizzyOps</b><br><small>Operations workspace</small></div></div><div class="avatar" title="Account not configured">ADA</div></header><section class="content"><div class="eyebrow">AfrodizzyActs / Operations</div><h1 id="title">Overview</h1><p id="subtitle">Your centralized workspace for bookings, performers, finance and operations.</p><div id="view"></div></section><footer class="footer">© AfrodizzyActs · DizzyOps · Initial portal preview — no live records connected</footer></main><script>
const sections=[['Overview','Dashboard'],['Bookings','Bookings'],['Jobs & Assignments','Jobs'],['Performers','Performers'],['Clients & CRM','Clients'],['Agents & Suppliers','Partners'],['Quotes','Quotes'],['Invoices & Receipts','Invoices'],['Expenses & Commissions','Expenses'],['Payslips & Statements','Payroll'],['Costumes & Inventory','Inventory'],['Assets & Couriers','Assets'],['Fabrication','Fabrication'],['Documents','Documents'],['Reports & Analytics','Reports'],['Settings','Settings']];
const nav=document.getElementById('nav'),view=document.getElementById('view'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),sidebar=document.getElementById('sidebar');
function empty(name){return '<div class="empty"><strong>No '+name.toLowerCase()+' yet</strong><p>This workspace is ready for real records once secure authentication, data storage and integrations are configured. No sample records are displayed.</p></div>'}
function show(name){const valid=sections.find(s=>s[1]===name)||sections[0];name=valid[1];title.textContent=valid[0];subtitle.textContent=name==='Dashboard'?'Your centralized workspace for bookings, performers, finance and operations.':'Manage '+valid[0].toLowerCase()+' in the DizzyOps workspace.';nav.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.page===name);b.setAttribute('aria-current',b.dataset.page===name?'page':'false')});if(name==='Dashboard'){view.innerHTML='<div class="metrics">'+[['Active bookings','0'],['Registered performers','0'],['Open invoices','0'],['Pending assignments','0']].map(([a,b])=>'<div class="metric"><label>'+a+'</label><strong>'+b+'</strong></div>').join('')+'</div><div class="grid"><section class="panel"><h2>Upcoming bookings</h2>'+empty('bookings')+'</section><section class="panel"><h2>Recent activity</h2>'+empty('activity')+'</section></div>'}else{view.innerHTML='<div style="display:flex;justify-content:flex-end;margin:24px 0"><span class="pill">No records connected</span></div><section class="panel"><h2>'+valid[0]+'</h2>'+empty(valid[0])+'</section>'}sidebar.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');history.replaceState(null,'','#'+name.toLowerCase().replaceAll(' ','-'))}
sections.forEach(([label,key])=>{const b=document.createElement('button');b.textContent=label;b.dataset.page=key;b.addEventListener('click',()=>show(key));nav.appendChild(b)});document.getElementById('menu').addEventListener('click',()=>{const open=sidebar.classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(open))});show(sections.find(s=>s[1].toLowerCase()===location.hash.slice(1))?.[1]||'Dashboard');
</script></body></html>
