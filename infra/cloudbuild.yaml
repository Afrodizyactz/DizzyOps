# Build only. No credentials and no deployment of resources.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'server/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/dizzyops/dizzyops-api:${_IMAGE_TAG}', '.']
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/dizzyops/dizzyops-api:${_IMAGE_TAG}'
substitutions:
  _REGION: africa-south1
  _IMAGE_TAG: replace-with-approved-commit-sha
