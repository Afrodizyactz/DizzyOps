name: SAML authentication readiness checks
on:
  push:
    branches: [main]
    paths:
      - 'auth/**'
      - 'server/**'
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-routes.js'
      - 'portal-ui.css'
      - 'operations-ui.css'
      - 'operations-schema.js'
      - 'operations-ui.js'
      - 'quotes.js'
      - 'finance.js'
      - 'sage-readiness.js'
      - 'test/**'
      - '.github/workflows/auth-checks.yml'
  pull_request:
    paths:
      - 'auth/**'
      - 'server/**'
      - 'portal.html'
      - 'portal-app.js'
      - 'portal-routes.js'
      - 'portal-ui.css'
      - 'operations-ui.css'
      - 'operations-schema.js'
      - 'operations-ui.js'
      - 'quotes.js'
      - 'finance.js'
      - 'sage-readiness.js'
      - 'test/**'
      - '.github/workflows/auth-checks.yml'
permissions:
  contents: read
jobs:
  auth-source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse authentication and portal scripts
        run: |
          node --check server/index.js
          node --check auth/login.js
          node --check auth/identity-platform.js
          node --check portal-app.js
          node --check portal-routes.js
          node --check quotes.js
          node --check finance.js
          node --check sage-readiness.js
          node --check operations-schema.js
          node --check operations-ui.js
      - name: Verify certificate and fail-closed auth settings
        run: npm test --prefix server

      - name: Test portal routing and protected module wiring
        run: node --test test/portal-routing.test.cjs

      - name: Validate operational schemas and backend safety gates
        run: node --test test/operational-workspaces.test.cjs
